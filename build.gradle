plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"creditmanager" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

sourceSets {
	test {
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
	// Deliberately isolated from main/client/release classpaths. Local sources
	// are ignored by Git and only compiled on an explicit dev-test-data request.
	devTestData {
		java.srcDir 'local-dev'
		compileClasspath += sourceSets.client.runtimeClasspath
		runtimeClasspath += sourceSets.client.runtimeClasspath
	}
}


dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// H2 is a pure-Java embedded database.  Loom packages it into the client jar,
	// so CreditManager has no native or online database dependency at runtime.
	implementation include("com.h2database:h2:2.3.232")

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
	
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.named('test') {
	failOnNoDiscoveredTests = false
	useJUnitPlatform()
}

tasks.register('compileDevTestData') {
	group = 'development'
	description = 'Compiles the ignored local test-data helper when explicitly enabled.'
	onlyIf { Boolean.getBoolean('creditmanager.devTestData') }
	dependsOn tasks.named('devTestDataClasses')
}

tasks.register('verifyAmountParser', JavaExec) {
	group = 'verification'
	description = 'Runs deterministic balance-format parser smoke tests.'
	dependsOn tasks.named('compileTestJava')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'op.creditmanager.client.util.FormatUtilSelfTest'
}

tasks.register('verifyReleaseJar') {
	group = 'verification'
	description = 'Verifies that the release jar contains H2 but no local development test tool.'
	dependsOn tasks.named('remapJar')
	doLast {
		def releaseJar = tasks.named('remapJar').get().archiveFile.get().asFile
		def entries = new java.util.zip.ZipFile(releaseJar).withCloseable { zip ->
			zip.entries().collect { it.name }
		}
		if (!entries.any { it ==~ /META-INF\/jars\/h2-.+\.jar/ }) {
			throw new GradleException("Release jar does not embed H2: ${releaseJar}")
		}
		def forbidden = entries.findAll { it.startsWith('local-dev/') || it.contains('CreditManagerTestDataTool') || it.contains('/dev/') }
		if (!forbidden.isEmpty()) {
			throw new GradleException("Release jar contains development-only files: ${forbidden}")
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyReleaseJar')
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	// IntelliJ needs the hook on the local client classpath, but it must never
	// be shipped in the remapped production jar.
	exclude 'op/creditmanager/client/devtools/**'
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
